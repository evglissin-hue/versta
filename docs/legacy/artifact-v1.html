<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storied Routes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
/* Layout idea: an Admiralty chart turned into a strip map. One vertical rail of numbered
   marks down the left, stops hang off it, a thumb-reach dock at the bottom drives the ride. */
:root{
  --paper:#F5F8F5;      /* chart paper */
  --shoal:#D8E8F0;      /* shallow-water blue */
  --land:#EDE0B2;       /* chart land buff */
  --ink:#0E2233;        /* chart ink */
  --muted:#566978;
  --line:#B9C8CC;
  --mark:#A61C6E;       /* chart magenta, used for lights and marks */
  --on-mark:#FFFFFF;
  --f-display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --f-body:"Newsreader",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0B1620; --shoal:#12283A; --land:#3A3418; --ink:#DDE7EA; --muted:#8FA3AF;
    --line:#274052; --mark:#F07CC0; --on-mark:#1A0612; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0B1620; --shoal:#12283A; --land:#3A3418; --ink:#DDE7EA; --muted:#8FA3AF;
  --line:#274052; --mark:#F07CC0; --on-mark:#1A0612; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.5;
  padding:0 16px 190px;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.label{font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
header.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-top:18px;border-bottom:2px solid var(--ink);padding-bottom:8px}
header.top .brand{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.14em;text-transform:uppercase}
.routes{display:flex;gap:8px;flex-wrap:wrap}
.routes button{font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:.06em;text-transform:uppercase;
  min-height:40px;padding:6px 14px;border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:2px;cursor:pointer}
.routes button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.hero h1{font-family:var(--f-display);font-weight:700;font-size:clamp(54px,17vw,96px);line-height:.88;letter-spacing:-.01em;
  text-transform:uppercase;margin:6px 0 10px;text-wrap:balance}
.hero .bearing{font-family:var(--f-display);font-weight:500;font-size:16px;letter-spacing:.08em;color:var(--mark);font-variant-numeric:tabular-nums}
.hero p{margin:10px 0 0;max-width:34em}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:2px solid var(--ink);margin-top:16px}
.stats div{padding:8px 10px;border-right:1px solid var(--line)}
.stats div:last-child{border-right:0}
.stats b{display:block;font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.stats span{font-family:var(--f-display);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sound{background:var(--shoal);padding:14px;display:flex;flex-direction:column;gap:10px}
.switches{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.switches button{font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.06em;text-transform:uppercase;
  min-height:48px;border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:2px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px}
.switches button::before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid currentColor}
.switches button[aria-checked="true"]{background:var(--ink);color:var(--paper)}
.switches button[aria-checked="true"]::before{background:var(--mark);border-color:var(--mark)}
.switches button:disabled{opacity:.45;cursor:not-allowed}
.sound small{font-size:15px;color:var(--muted);line-height:1.35}
.progress{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:6px;background:var(--line)}
.bar i{display:block;height:100%;width:0;background:var(--mark);transition:width .3s}
.leg{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:2px solid var(--ink);padding-top:10px;margin-top:6px}
.leg h2{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1}
ol.strip{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;position:relative}
ol.strip::before{content:"";position:absolute;left:21px;top:0;bottom:0;width:2px;background:var(--ink)}
.stop{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:14px 0 22px;position:relative;scroll-margin-top:12px}
.dot{position:relative;z-index:1;width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);
  display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.stop.visited .dot{background:var(--ink);color:var(--paper)}
.stop.next .dot{border-color:var(--mark);box-shadow:0 0 0 4px var(--paper),0 0 0 6px var(--mark);color:var(--mark)}
.stop.visited .body>h3{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--line)}
.body{min-width:0;display:flex;flex-direction:column;gap:10px}
.meta{display:flex;gap:12px;flex-wrap:wrap;font-family:var(--f-display);font-size:14px;letter-spacing:.08em;color:var(--muted);font-variant-numeric:tabular-nums;text-transform:uppercase}
.body>h3{font-family:var(--f-display);font-weight:700;font-size:32px;line-height:1;margin:0;text-transform:uppercase;text-wrap:balance}
.note{margin:0;font-size:17px}
.chip{display:inline-block;font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:2px}
.chip.pint{background:var(--land);color:var(--ink)}
.chip.core{background:var(--mark);color:var(--on-mark)}
.chip.optional{border:1.5px solid var(--muted);color:var(--muted)}
.chip.tag{background:var(--shoal);color:var(--ink)}
.shead{flex-wrap:wrap}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;
  min-height:48px;padding:10px 16px;border:2px solid var(--ink);border-radius:2px;background:var(--ink);color:var(--paper);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.play{background:var(--mark);border-color:var(--mark);color:var(--on-mark)}
.btn.small{min-height:40px;font-size:15px;padding:6px 12px}
.btn:focus-visible,.routes button:focus-visible,.switches button:focus-visible,summary:focus-visible{outline:3px solid var(--mark);outline-offset:3px}
.story{border-left:4px solid var(--shoal);padding:4px 0 4px 12px;display:flex;flex-direction:column;gap:8px}
.story.playing{border-left-color:var(--mark)}
.shead{display:flex;gap:10px;align-items:center}
.mins{font-family:var(--f-display);font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.story h4{font-family:var(--f-body);font-style:italic;font-weight:400;font-size:24px;line-height:1.15;margin:0;text-wrap:balance}
.story .btn{align-self:flex-start}
details summary{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);cursor:pointer;padding:6px 0;min-height:36px}
.paras p{margin:0 0 .8em;font-size:19px;line-height:1.5;max-width:32em}
.paras p.now{background:var(--shoal);box-shadow:-6px 0 0 var(--shoal),6px 0 0 var(--shoal)}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:2px solid var(--ink);padding:10px 16px 14px;z-index:10}
.dock-in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.dock-label{display:flex;gap:10px;align-items:baseline;min-width:0}
.dock-label strong{font-family:var(--f-display);font-weight:700;font-size:22px;text-transform:uppercase;line-height:1.05;overflow-wrap:anywhere}
.dock-btns{display:grid;grid-template-columns:1fr 1.2fr .8fr;gap:8px}
.dock-btns .btn{padding:10px 6px;min-height:54px}
.foot{font-size:15px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
@media (max-width:380px){.stats{grid-template-columns:repeat(2,1fr)}.stats div:nth-child(2){border-right:0}.stats div:nth-child(-n+2){border-bottom:1px solid var(--line)}.btn{font-size:16px}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="brand">Storied Routes</span>
    <nav class="routes" id="routes" aria-label="Routes"></nav>
  </header>

  <section class="hero" id="hero"></section>

  <section class="sound" aria-label="Sound">
    <span class="label">Sound for the stories</span>
    <div class="switches">
      <button type="button" role="switch" id="swVoice" aria-checked="true">Voice</button>
      <button type="button" role="switch" id="swAmb" aria-checked="true">Ambience</button>
      <button type="button" role="switch" id="swMusic" aria-checked="true">Music</button>
    </div>
    <small id="voiceNote">Checking which voice this viewer offers.</small>
  </section>

  <div class="progress"><span class="label" id="progText">0 of 0 stops</span><div class="bar"><i id="progBar"></i></div></div>

  <ol class="strip" id="strip"></ol>

  <p class="foot">Navigate opens Google Maps with directions from where you are. Your progress is kept on this device only.</p>
</div>

<div class="dock" role="region" aria-label="Next stop">
  <div class="dock-in">
    <div class="dock-label"><span class="label" id="dockState">Next stop</span><strong id="dockName"></strong></div>
    <div class="dock-btns">
      <a class="btn" id="dockNav" href="#" target="_blank" rel="noopener">Navigate</a>
      <button type="button" class="btn play" id="dockPlay">Play story</button>
      <button type="button" class="btn ghost" id="dockDone">Done</button>
    </div>
  </div>
</div>

<script>
/* ---------------------------------------------------------------
   ROUTES. To add a trip, add one object to this array.
   mode: "bicycling" or "walking". amb: a soundscape name from AMB.
   story.kind: "core" or "optional". story.mood: "minor" or "bright".
   story.tags: optional labels such as "Spies" or "Russia".
   House style for every route: history first, told in the present tense as if it
   is happening now. Wherever it is true to the place, give priority to espionage
   and intelligence stories and to Russian history, and make those core.
---------------------------------------------------------------- */
const ROUTES = [
{
  id: "thames-loop",
  name: "Thames Loop",
  mode: "bicycling",
  km: 22,
  ride: "1.5 h",
  blurb: "Downriver on the south bank to Greenwich, under the Thames on foot, then home along the north bank through the old docks, Limehouse and Wapping. Ships, shipyards, pirates and three very old pubs.",
  legs: [
    { name: "Out: south bank", from: 0, to: 5 },
    { name: "Back: north bank", from: 6, to: 12 }
  ],
  stops: [
    { id:"tower-bridge", name:"Tower Bridge", q:"Tower Bridge, London", pid:"ChIJSdtli0MDdkgRLW9aCBpCeJ4", lat:51.5054564, lng:-0.0753565, amb:"river",
      note:"Start here. Cross to the south side, then drop left to Shad Thames.",
      stories:[{ title:"The richest water on earth", kind:"core", mood:"bright", paras:[
        "It is the summer of 1894 and the bridge is six weeks old. The stone is still pale. The paint still smells.",
        "Look downstream. The Pool of London is so thick with shipping that a man could almost cross the river from deck to deck. Colliers black with Newcastle coal. Tea ships home from China. Dutch eel boats on a mooring their grandfathers held. Between them, hundreds of flat lighters, each steered by one man with one long oar and a lifetime of knowing the tide.",
        "Under the roadway, coal fires heat the boilers. Steam drives the pumps. Water under enormous pressure waits in six iron accumulators. Then a bell rings, the carts and horses stop, and a thousand tons of road on each side tilts up into the sky in about a minute, as quietly as a door.",
        "It happens twenty times a day. Nobody on the river looks up. They are busy. This is the richest stretch of water on earth, and you are about to follow it towards the sea."
      ]},
      { title:"The chair in the rifle range", kind:"optional", mood:"minor", amb:"solemn", tags:["Spies"], paras:[
        "Before you leave the Tower behind, one story from inside its walls.",
        "In the autumn of 1914 a polite, well dressed American tourist called Charles Inglis is cycling round the Firth of Forth, admiring the warships. His real name is Carl Hans Lody. He is a German naval reserve officer, he has had almost no training, and he is posting his reports to Stockholm in plain language. A new and very small department in London, which will one day be called MI5, is reading every one of them.",
        "He is tried in public and shot at dawn on the sixth of November, in the Tower's indoor rifle range. It is the first execution here in more than a hundred and fifty years. He walks to the chair unaided and thanks his guards. The officer in charge is said to have told him that he would not shake hands with a spy, but would gladly shake hands with a brave man.",
        "Ten more follow him before the war ends.",
        "The last comes in 1941. Josef Jakobs parachutes into a field in Huntingdonshire, breaks his ankle on landing, and lies there all night until he fires his pistol to call for help. He cannot stand to face the firing squad. So they seat him in an old brown Windsor chair, and that is how the last execution at the Tower of London is carried out."
      ]}]},
    { id:"shad-thames", name:"Shad Thames", q:"Shad Thames, London", pid:"ChIJFfwg0UUDdkgR3kr97Wa_N6A", lat:51.5019465, lng:-0.072381, amb:"wharf",
      note:"Cobbled warehouse canyon with iron gantries overhead. Roll slowly.",
      stories:[{ title:"The street that smelled of cinnamon", kind:"core", mood:"minor", paras:[
        "Slow down. The cobbles want you to.",
        "It is 1880 and this narrow street is the busiest larder in the world. The warehouses of Butler's Wharf rise on both sides like cliffs, and over your head the iron bridges are never still. Porters run barrels and chests across them, from the river side to the land side, six floors up, shouting warnings nobody below can hear.",
        "Every doorway breathes something different. Tea from Assam. Coffee. Cloves, cinnamon, pepper, cardamom. Sugar and tapioca, dried fruit, rubber. A blind man could walk this street and tell you which ship came in last night.",
        "The men who work here are hired by the half day. They wait at the gate at dawn, and the foreman points. If he does not point at you, your children do not eat.",
        "When the warehouses finally closed, a century later, people said the brick still smelled of spice in the rain."
      ]}]},
    { id:"mayflower", name:"The Mayflower", q:"The Mayflower pub, Rotherhithe Street, London", pid:"ChIJo3GMMiQDdkgRLEL6Mu4LR8s", lat:51.5018403, lng:-0.0536173, amb:"ship", pint:true,
      note:"Old Rotherhithe village. The jetty behind the pub sits right over the river.",
      stories:[{ title:"Captain Jones goes home", kind:"core", mood:"minor", paras:[
        "Lean on the rail and look at the water.",
        "In the summer of 1620 a tired merchant ship lay on this mooring. She had spent years hauling wine from Bordeaux, and her timbers were said to smell sweet because of it. Her master, Christopher Jones, lived a few streets away.",
        "That July she took on stores and passengers here and dropped down the river on the tide, bound for Southampton, and then for a coast most of her crew had never seen. There were a hundred and two passengers by the time she left Plymouth. The crossing took sixty six days. Half of them were dead before the spring.",
        "Jones brought his ship back to this reach the following May. He never fully recovered from that winter. He died within a year, and they buried him in the churchyard across the lane, fifty paces from where you are standing.",
        "The Mayflower herself was left to rot on the mud here. Nobody thought she was worth saving."
      ]}]},
    { id:"greenland-dock", name:"Greenland Dock", q:"Greenland Dock, London", pid:"ChIJb4zARt0CdkgR8X9Z7P1fojQ", lat:51.494728, lng:-0.0387495, amb:"arctic",
      note:"Wide open water and one of the sunniest spots on the south bank.",
      stories:[{ title:"The whalers come home", kind:"optional", mood:"minor", paras:[
        "It is a September afternoon in 1770 and you can smell the fleet before you see it.",
        "When this dock was dug, seventy years ago, it was the largest anyone had seen. Ten acres of still water, room for a hundred and twenty ships, with a wall of trees planted round it to break the wind.",
        "Now it belongs to the whalers. They sail every spring for the ice off Greenland and Spitsbergen, forty or fifty men to a ship, and hunt the bowhead whale from open boats with hand harpoons. A whale can drag a boat for miles. A flick of its tail can put six men in the sea, and in that water a man lasts a few minutes.",
        "The ones who come back come back here. The blubber is hacked out of the hold in grey slabs and boiled down in great copper pans along the quay. The smoke is black and greasy. The stink carries all the way to Deptford.",
        "But that oil lights the lamps of London. Every lit window, every street lantern, every theatre. The whole bright city is burning what these men dragged out of the Arctic.",
        "Walk along the edge. The water is quiet now. It was not a quiet place."
      ]}]},
    { id:"peter-the-great", name:"Deptford & the Tsar", q:"Peter the Great Statue, Glaisher Street, London", pid:"ChIJu3nNio0CdkgRY6Y5SzITMX4", lat:51.483369, lng:-0.0190625, amb:"yard",
      note:"The statue stands at the mouth of Deptford Creek, with the old royal dockyard just upstream. Five minutes inland, St Nicholas church has skulls on its gateposts and Marlowe somewhere in its churchyard.",
      stories:[{ title:"The tsar in the shipyard", kind:"core", mood:"bright", tags:["Russia"], paras:[
        "In the winter of 1698 a young man nearly seven feet tall arrives in Deptford and asks to be taught how to build a ship.",
        "He is twenty five. He is the Tsar of Russia. He is travelling as plain Peter Mikhailov, a disguise that fools nobody, at the head of a mission two hundred and fifty strong. Its orders are simple. Learn everything. Sketch everything. Hire everyone who will come.",
        "He has rented the finest house in the village, Sayes Court, because its garden gate opens straight into the King's dockyard. That yard is why he is here. Henry the Eighth founded it. Drake was knighted in it, on the deck of the Golden Hind. Now it is the most advanced shipyard in the world, and Peter wants all of it.",
        "He is in the yard at dawn. He handles the tools, sketches hulls, questions the shipwrights. He goes up the hill to the Observatory to learn navigation. He visits the Mint and the arsenal at Woolwich, and he watches Parliament in secret through a window in the roof.",
        "In the evenings he and his companions drink, and the house pays for it. Three hundred window panes broken. Paintings used for target practice. Chairs burned as firewood. And through the owner's prized holly hedge, the pride of his life, somebody has been pushing somebody else in a wheelbarrow. For fun. Repeatedly.",
        "Sir Christopher Wren is sent to add up the damage. The Treasury pays three hundred and fifty pounds.",
        "He sails home with a head full of English hulls and some sixty hired British specialists: shipwrights, mathematicians, lock builders, seamen. Five years later he founds a city on the Baltic. Within a generation Russia has a navy that can beat Sweden's.",
        "It started here, in the mud, with a borrowed adze."
      ]},
      { title:"The reckoning", kind:"core", mood:"minor", amb:"tavern", tags:["Spies"], paras:[
        "A few hundred yards from here, on the thirtieth of May 1593, four men spend a whole day together in a private room in a widow's house on Deptford Strand.",
        "One is Christopher Marlowe. He is twenty nine, the most famous playwright in England, and for years he has been something else as well. When Cambridge tried to refuse him his degree, the Queen's own council wrote to say he had done her good service in matters they would not name. That is how a government talks about a spy.",
        "Look at the company he keeps today. Robert Poley, courier and agent, the man who wormed his way into the Babington plot and helped send Mary Queen of Scots to the block. Nicholas Skeres, another creature of the same trade. And Ingram Frizer, who works for the spymaster's family.",
        "Marlowe is in trouble. He is under investigation for heresy and must report to the council every day. He knows a great many secrets, and he is known to talk.",
        "They eat. They walk in the garden. They eat again. Then, the three survivors say, there is a quarrel about the bill. Marlowe snatches Frizer's dagger. Frizer turns it back on him. The blade goes in above the right eye.",
        "The Queen's coroner hears three practised liars tell the same story and rules it self defence. Frizer is pardoned within a month.",
        "Marlowe is buried two days later in the churchyard of St Nicholas, five minutes inland from here. Nobody marked the grave."
      ]}]},
    { id:"greenwich", name:"Cutty Sark & Greenwich", q:"Cutty Sark, Greenwich, London", pid:"ChIJAVlhMIUCdkgRCJEgHVbITq4", lat:51.4828646, lng:-0.0095917, amb:"sail",
      note:"Loop through the Old Royal Naval College to the river wall, then come back. The tunnel entrance is the glass dome beside the ship.",
      stories:[
        { title:"The last of the racers", kind:"core", mood:"bright", paras:[
          "Look up at the masts. A hundred and fifty feet of them, and once three quarters of an acre of canvas hung there.",
          "She was built in 1869 for one purpose: to be first home from China with the new season's tea. The first chests into London each year sold for a fortune, so the clippers raced, fifteen thousand miles, and the whole country bet on them.",
          "Her bad luck was her birthday. The Suez Canal opened the same week she was launched. Steamships could take the short cut. Sailing ships could not. Within a few years the tea trade was gone.",
          "So she went south for Australian wool instead, and there, in the great winds below the Cape, she finally showed what she was. Seventeen knots. Sydney to London in seventy three days. She would overhaul steamers and leave them astern.",
          "Her name is a joke from a Burns poem: a young witch dancing in a short shirt, a cutty sark, fast enough to catch a galloping horse by the tail. Find the figurehead. She is still holding it."
        ]},
        { title:"Nelson comes home", kind:"optional", mood:"minor", amb:"solemn", paras:[
          "Walk to the river wall in front of the two domes and face the water.",
          "It is Christmas Eve, 1805. A boat comes alongside in the dusk, and the old sailors who live in this hospital, men with one arm, one leg, one eye, line the steps without being told to.",
          "The coffin they carry up was made from the mainmast of a French flagship that Nelson himself destroyed at the Nile. He had kept it in his cabin for years. He thought it was funny.",
          "His body has come home from Trafalgar in a cask of brandy. For three days in January he lies in the Painted Hall behind you, and thousands upon thousands queue in the cold to file past. Many more are turned away.",
          "Then, on a bitter morning with the wind against the tide, a black barge takes him upriver to London, with a long line of boats behind it. Every ship on the river lowers its flag. The guns fire once a minute.",
          "The pensioners stand on this wall until the last boat is out of sight."
        ]},
        { title:"The secret agent", kind:"optional", mood:"minor", amb:"clock", tags:["Spies"], paras:[
          "Look up the hill to the Observatory. Every clock in the world is set from that building.",
          "On a cold afternoon in February 1894 a young Frenchman gets off the tram from Westminster and walks into the park with a parcel under his coat. His name is Martial Bourdin. He is twenty six, a tailor, and a member of an anarchist club off Tottenham Court Road that the police have watched for years.",
          "A few minutes before five, the park keepers hear a bang on the zigzag path below the Observatory. They find him on his knees. His left hand is gone. He asks only to be taken home. He dies half an hour later without saying what he meant to do.",
          "In his pockets is a good deal of money in gold. More than a tailor should have.",
          "Nobody ever proved who sent him. But the rumour in the anarchist clubs was ugly: that the man who gave him the bomb, his own brother in law, was in the pay of the police.",
          "Joseph Conrad heard the story and could not leave it alone. In his novel the bomber is a simple boy, and the man behind him is a shabby double agent taking money from a foreign embassy. The embassy is never named. Most readers in 1907 took it for the Russian one.",
          "The clocks on the hill did not miss a second."
        ]}

};
const AMB = {
  river(s){ L.water(s, 0.8); L.gulls(s, 0.8); L.foghorn(s, 1); L.creak(s, 0.4); },
  wharf(s){ L.water(s, 0.4); L.creak(s, 0.9); L.gulls(s, 0.6); },
  ship(s){ L.water(s, 0.7); L.wind(s, 0.4); L.creak(s, 1); },
  arctic(s){ L.wind(s, 1); L.water(s, 0.8); L.creak(s, 0.7); },
  yard(s){ L.water(s, 0.4); L.hammer(s, 1); L.gulls(s, 0.5); },
  sail(s){ L.wind(s, 0.9); L.water(s, 0.6); L.creak(s, 0.8); },
  solemn(s){ L.water(s, 0.5); L.wind(s, 0.3); L.toll(s, 1, 220, 6, 7); },
  tunnel(s){ L.rumble(s, 1); L.drips(s, 1); },
  dock(s){ L.water(s, 0.6); L.creak(s, 0.6); L.gulls(s, 0.5); },
  tavern(s){ L.murmur(s, 1); L.clink(s, 1); L.water(s, 0.25); L.creak(s, 0.4); },
  sailortown(s){ L.murmur(s, 0.7); L.bells(s, 1); },
  canal(s){ L.water(s, 0.35); L.wind(s, 0.15); },
  clock(s){ L.wind(s, 0.45); L.tick(s, 1); }
};
function startAmbience(name, ducked){
  if (!audio()) return; endSession(AX.amb, 0.4);
  const s = session(ducked ? 0.5 : 0.9); AX.amb = s;
  L.bell(s, 1, 660, 0.15); L.bell(s, 1, 660, 0.75);          // two strokes of the ship's bell open every story
  (AMB[name] || AMB.river)(s);
}
function startMusic(mood, ducked){
  if (!audio()) return; endSession(AX.mus, 0.4);
  const s = session(ducked ? 0.45 : 0.8); AX.mus = s;
  const third = mood === "bright" ? 185.0 : 174.61;
  const lp = F("lowpass", 900); lp.connect(s.bus); lfo(s, 0.05, 320, lp.frequency);
  [73.42, 110, 146.83, third, 220].forEach((f, i) => {
    [-4, 4].forEach((c, j) => { const o = AX.ctx.createOscillator(); o.type = j ? "triangle" : "sine"; o.frequency.value = f; o.detune.value = c;
      const g = G(0.02 - i * 0.0018); o.connect(g); g.connect(lp); lfo(s, 0.03 + i * 0.011, 0.008, g.gain); o.start(); s.srcs.push(o); });
  });
  const d = AX.ctx.createDelay(1); d.delayTime.value = 0.42; const fb = G(0.38); d.connect(fb); fb.connect(d); d.connect(s.bus);
  const scale = mood === "bright" ? [293.66, 329.63, 369.99, 440, 493.88, 587.33] : [293.66, 329.63, 392, 440, 523.25, 587.33];
  every(s, 4.5, 9, () => { const t = AX.ctx.currentTime, o = AX.ctx.createOscillator(), g = G(0); o.type = "triangle"; o.frequency.value = scale[Math.floor(Math.random() * scale.length)];
    g.gain.linearRampToValueAtTime(0.03, t + 0.5); g.gain.exponentialRampToValueAtTime(0.0006, t + 3.5); o.connect(g); g.connect(s.bus); g.connect(d); o.start(t); o.stop(t + 3.7); }, 3);
}
function duck(on){
  if (!AX.ctx) return; const t = AX.ctx.currentTime;
  if (AX.amb && !AX.amb.dead) AX.amb.bus.gain.setTargetAtTime(on ? 0.5 : 0.9, t, 0.5);
  if (AX.mus && !AX.mus.dead) AX.mus.bus.gain.setTargetAtTime(on ? 0.45 : 0.8, t, 0.5);
}
function stopSound(fade){ endSession(AX.amb, fade); endSession(AX.mus, fade); AX.amb = AX.mus = null; }

/* ------------------------- playback ------------------------- */
const played = {};
function pickStory(si){   // the dock plays core stories first, then optional ones, skipping any already heard
  const ss = route.stops[si].stories, order = ss.map((s, k) => k).sort((a, b) => (ss[a].kind === "core" ? 0 : 1) - (ss[b].kind === "core" ? 0 : 1));
  for (const k of order) if (!played[route.id + ":" + si + ":" + k]) return k;
  return order[0];
}
function markPara(id){
  $$(".paras p.now").forEach(p => p.classList.remove("now"));
  if (!playing || id === null) return;
  const p = $("#d-" + playing.si + "-" + playing.ki + ' p[data-p="' + id + '"]');
  if (p){ p.classList.add("now"); try{ p.scrollIntoView({ block:"center", behavior:"smooth" }); }catch(e){} }
}
function stopStory(fade){
  playToken++; stopVoice(); stopSound(fade === undefined ? 0.4 : fade); playing = null; markPara(null); syncPlaying();
}
function playStory(si, ki){
  if (playing && playing.si === si && playing.ki === ki){ stopStory(); return; }
  stopStory(0.2);
  const token = ++playToken, stop = route.stops[si], story = stop.stories[ki];
  playing = { si, ki }; played[route.id + ":" + si + ":" + ki] = true;
  const det = $("#d-" + si + "-" + ki); if (det) det.open = true;
  const useVoice = prefs.voice && voiceMode !== "none";
  if (prefs.amb) startAmbience(story.amb || stop.amb, useVoice);
  if (prefs.music) startMusic(story.mood, useVoice);
  syncPlaying();
  const sec = $("#s-" + si + "-" + ki); if (sec){ try{ sec.scrollIntoView({ block:"start", behavior:"smooth" }); }catch(e){} }
  const finish = linger => { if (token !== playToken) return; duck(false);
    setTimeout(() => { if (token === playToken) stopStory(1.4); }, linger); };
  if (!useVoice){ finish(Math.max(60, mins(story) * 75) * 1000); return; }
  const go = () => { if (token !== playToken) return;
    speak(story.paras, token).then(() => finish(7000)).catch(err => {
      if (token !== playToken) return;
      const code = err && err.code;
      if (voiceMode === "claude" && (code === "not_granted" || code === "unavailable")){
        claudeTts = null; voiceMode = ("speechSynthesis" in window) ? "browser" : "none"; voiceNote();
      }
      finish(code === "stopped" ? 0 : 60000);
    }); };
  if (voiceMode === "browser") go(); else setTimeout(go, 1700);   // device voices must start inside the tap
}

/* ------------------------- rendering ------------------------- */
function nextIndex(){ for (let i = 0; i < route.stops.length; i++) if (visited.indexOf(route.stops[i].id) < 0) return i; return -1; }
function renderRoutes(){
  $("#routes").innerHTML = ROUTES.map(r => '<button type="button" data-route="' + r.id + '" aria-pressed="' + (r === route) + '">' + r.name + "</button>").join("");
}
function renderHero(){
  const a = route.stops[0], far = route.stops.reduce((m, s) => kmBetween(a, s) > kmBetween(a, m) ? s : m, a);
  const core = route.stops.reduce((n, s) => n + s.stories.filter(x => x.kind === "core").length, 0);
  const all = route.stops.reduce((n, s) => n + s.stories.length, 0);
  $("#hero").innerHTML =
    '<span class="label">' + (route.mode === "walking" ? "Walking route" : "Bike route") + "</span>" +
    "<h1>" + route.name + "</h1>" +
    '<div class="bearing">' + coord(a.lat, a.lng) + " to " + coord(far.lat, far.lng) + " and back</div>" +
    "<p>" + route.blurb + "</p>" +
    '<div class="stats"><div><b>' + route.km + "</b><span>km</span></div><div><b>" + route.ride + "</b><span>moving</span></div><div><b>" +
    route.stops.length + "</b><span>stops</span></div><div><b>" + core + "+" + (all - core) + "</b><span>stories</span></div></div>";
}
function renderStrip(){
  let html = "";
  route.stops.forEach((s, i) => {
    const leg = route.legs.find(l => l.from === i);
    if (leg) html += '<li class="leg"><h2>' + leg.name + '</h2><a class="btn ghost small" target="_blank" rel="noopener" href="' + legUrl(route, leg) + '">Whole leg in Maps</a></li>';
    const dist = i ? "about " + kmBetween(route.stops[i - 1], s).toFixed(1) + " km on" : "start";
    const stories = s.stories.map((st, k) =>
      '<section class="story" id="s-' + i + "-" + k + '">' +
        '<div class="shead"><span class="chip ' + st.kind + '">' + (st.kind === "core" ? "Core story" : "Optional") + "</span>" +
          (st.tags || []).map(t => '<span class="chip tag">' + t + "</span>").join("") + '<span class="mins">' + mins(st) + " min</span></div>" +
        "<h4>" + st.title + "</h4>" +
        '<button type="button" class="btn play" data-play="' + i + ":" + k + '">Play story</button>' +
        '<details id="d-' + i + "-" + k + '"><summary>Read it</summary><div class="paras">' + st.paras.map((p, j) => '<p data-p="' + j + '">' + p + "</p>").join("") + "</div></details>" +
      "</section>").join("");
    html += '<li class="stop" id="stop-' + s.id + '" data-i="' + i + '">' +
      '<div><span class="dot">' + String(i + 1).padStart(2, "0") + "</span></div>" +
      '<div class="body">' +
        '<div class="meta"><span>' + coord(s.lat, s.lng) + "</span><span>" + dist + "</span></div>" +
        "<h3>" + s.name + "</h3>" +
        (s.pint ? '<div><span class="chip pint">Pint stop</span></div>' : "") +
        '<p class="note">' + s.note + "</p>" +
        '<div class="acts"><a class="btn" target="_blank" rel="noopener" href="' + navUrl(route, s) + '">Navigate</a>' +
        '<button type="button" class="btn ghost" data-visit="' + i + '">Mark visited</button></div>' +
        stories +
      "</div></li>";
  });
  $("#strip").innerHTML = html;
}
function syncProgress(){
  const n = route.stops.filter(s => visited.indexOf(s.id) >= 0).length, ni = nextIndex();
  $("#progText").textContent = n + " of " + route.stops.length + " stops";
  $("#progBar").style.width = (100 * n / route.stops.length) + "%";
  $$(".stop").forEach(li => { const i = +li.dataset.i, v = visited.indexOf(route.stops[i].id) >= 0;
    li.classList.toggle("visited", v); li.classList.toggle("next", i === ni);
    $("[data-visit]", li).textContent = v ? "Visited. Undo" : "Mark visited"; });
  syncDock();
}
function syncDock(){
  const ni = nextIndex(), nav = $("#dockNav"), play = $("#dockPlay"), done = $("#dockDone");
  if (playing){
    const st = route.stops[playing.si].stories[playing.ki];
    $("#dockState").textContent = "Playing"; $("#dockName").textContent = st.title; play.textContent = "Stop";
  } else if (ni < 0){
    $("#dockState").textContent = "Route complete"; $("#dockName").textContent = "Log closed"; play.textContent = "Play story";
  } else {
    $("#dockState").textContent = "Next stop " + String(ni + 1).padStart(2, "0"); $("#dockName").textContent = route.stops[ni].name; play.textContent = "Play story";
  }
  const t = ni < 0 ? route.stops[route.stops.length - 1] : route.stops[ni];
  nav.href = navUrl(route, t); play.disabled = !playing && ni < 0; done.disabled = ni < 0;
  done.textContent = ni < 0 ? "Done" : "Done";
}
function syncPlaying(){
  $$(".story").forEach(s => s.classList.remove("playing"));
  $$("[data-play]").forEach(b => { b.textContent = "Play story"; });
  if (playing){
    const sec = $("#s-" + playing.si + "-" + playing.ki);
    if (sec){ sec.classList.add("playing"); $("[data-play]", sec).textContent = "Stop"; }
  }
  syncDock();
}
function syncSwitches(){
  $("#swVoice").setAttribute("aria-checked", String(prefs.voice && voiceMode !== "none"));
  $("#swAmb").setAttribute("aria-checked", String(prefs.amb));
  $("#swMusic").setAttribute("aria-checked", String(prefs.music));
}
function loadRoute(id){
  route = ROUTES.find(r => r.id === id) || ROUTES[0];
  visited = store.get("sr:visited:" + route.id, []);
  stopStory(0.2); renderRoutes(); renderHero(); renderStrip(); syncProgress(); syncPlaying();
}

/* ------------------------- events ------------------------- */
document.addEventListener("click", e => {
  const r = e.target.closest("[data-route]");
  if (r){ if (location.hash !== "#" + r.dataset.route) location.hash = r.dataset.route; else loadRoute(r.dataset.route); return; }
  const p = e.target.closest("[data-play]");
  if (p){ const a = p.dataset.play.split(":"); playStory(+a[0], +a[1]); return; }
  const v = e.target.closest("[data-visit]");
  if (v){ const id = route.stops[+v.dataset.visit].id, k = visited.indexOf(id);
    if (k >= 0) visited.splice(k, 1); else visited.push(id);
    store.set("sr:visited:" + route.id, visited); syncProgress(); return; }
});
$("#dockPlay").addEventListener("click", () => {
  if (playing){ stopStory(); return; }
  const ni = nextIndex(); if (ni < 0) return;
  playStory(ni, pickStory(ni));
});
$("#dockDone").addEventListener("click", () => {
  const ni = nextIndex(); if (ni < 0) return;
  if (playing && playing.si === ni) stopStory(0.8);
  visited.push(route.stops[ni].id); store.set("sr:visited:" + route.id, visited); syncProgress();
  const nx = nextIndex(); if (nx >= 0){ const el = $("#stop-" + route.stops[nx].id); if (el){ try{ el.scrollIntoView({ block:"start", behavior:"smooth" }); }catch(e){} } }
});
[["swVoice", "voice"], ["swAmb", "amb"], ["swMusic", "music"]].forEach(pair => {
  $("#" + pair[0]).addEventListener("click", () => {
    prefs[pair[1]] = !prefs[pair[1]]; store.set("sr:prefs", prefs); syncSwitches();
    if (playing){
      if (pair[1] === "amb"){ if (prefs.amb) startAmbience(route.stops[playing.si].stories[playing.ki].amb || route.stops[playing.si].amb, true); else { endSession(AX.amb, 0.4); AX.amb = null; } }
      if (pair[1] === "music"){ if (prefs.music) startMusic(route.stops[playing.si].stories[playing.ki].mood, true); else { endSession(AX.mus, 0.4); AX.mus = null; } }
      if (pair[1] === "voice" && !prefs.voice) stopVoice();
    }
  });
});
window.addEventListener("hashchange", () => loadRoute(location.hash.slice(1)));

voiceNote(); syncSwitches(); loadRoute(location.hash.slice(1));
</script>
</body>
</html>
