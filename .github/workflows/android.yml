name: Android APK

# Builds the installable Android app on every push to main, and on demand.
# The signed APK is a workflow artifact and the asset of the rolling release "android-latest".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Each run gets a higher version code, so every APK installs over the previous one.
      VERSTA_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The GitHub runner already has the Android SDK (ANDROID_HOME is set) with its licences accepted,
      # and Gradle fetches any platform or build tools it is missing. No separate SDK setup step:
      # android-actions/setup-android failed here asking for the long-gone "tools" package.

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Check, build the web app and copy it into the Android project
        run: |
          npm run typecheck
          npm run test
          npm run android:sync

      # The live update's rules and its file overlay (android/app/src/test): a bad bundle must never strand the phone.
      - name: Native unit tests
        working-directory: android
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Build the signed release APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Name the APK and verify its signature
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          cp "$APK" versta.apk
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs versta.apk
          ls -l versta.apk

      - name: Keep the APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: versta-apk
          path: versta.apk
          if-no-files-found: error

      # Only on main: the rolling release that Evgeny downloads from on the phone.
      - name: Publish the rolling release android-latest
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES="Build ${GITHUB_RUN_NUMBER} from ${GITHUB_SHA::7}. Install over the previous version: same signing key."
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest versta.apk --clobber
            gh release edit android-latest --notes "$NOTES"
          else
            gh release create android-latest versta.apk --title "Versta Android (latest)" --notes "$NOTES" --target "$GITHUB_SHA" --latest=false
          fi
